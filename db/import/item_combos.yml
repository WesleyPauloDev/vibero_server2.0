###########################################################################
# Item Combo Database
###########################################################################
#
# Settings
#
###########################################################################
# - Combos:                 List of combo sets.
#    - Combo:               Sequence of items to define a combo (minimum of 2 items).
#       - <item name>       AEGIS name of the item
#   Script                  Script to execute when one of the combos is equipped. (Default: null)
#   Clear                   Remove the defined combos from database. (Default: false)
###########################################################################

Header:
  Type: COMBO_DB
  Version: 1

# Fenda Good/Evil 3rd class parallel weapon combos.
Body:
  - Combos:
      - Combo:
          - Fenda_Circlet_RK   # 910200
          - Fenda_Justice_Power   # 910300
          - Fenda_Holy_RK_Weapon   # 910100
    Script: |
      bonus2 bSkillAtk,"RK_HUNDREDSPEAR",20;
      bonus2 bSkillAtk,"RK_SONICWAVE",20;

  - Combos:
      - Combo:
          - Fenda_Circlet_RK   # 910200
          - Fenda_Holy_RK_Weapon   # 910100
    Script: |
      .@r = getequiprefinerycnt(EQI_HAND_R)/3;
      bonus2 bSkillAtk,"RK_HUNDREDSPEAR",5*.@r;
      bonus2 bSkillAtk,"RK_SONICWAVE",5*.@r;
      if (getenchantgrade(EQI_HAND_R)>=ENCHANTGRADE_B) {
         bonus2 bSkillAtk,"RK_HUNDREDSPEAR",10;
      }

