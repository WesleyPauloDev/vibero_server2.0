###########################################################################
# Item Database
###########################################################################
#
# Item Settings
#
###########################################################################
# - Id                      Item ID.
#   AegisName               Server name to reference the item in scripts and lookups, should use no spaces.
#   Name                    Name in English for displaying as output.
#   Type                    Item type. (Default: Etc)
#   SubType                 Weapon, Ammo or Card type. (Default: 0)
#   Buy                     Buying price. When not specified, becomes double the sell price. (Default: 0)
#   Sell                    Selling price. When not specified, becomes half the buy price. (Default: 0)
#   Weight                  Item weight. Each 10 is 1 weight. (Default: 0)
#   Attack                  Weapon's attack. (Default: 0)
#   MagicAttack             Weapon's magic attack. (Default: 0)
#   Defense                 Armor's defense. (Default: 0)
#   Range                   Weapon's attack range. (Default: 0)
#   Slots                   Available slots in item. (Default: 0)
#   Jobs                    Jobs that can equip the item. (Map default is 'All: true')
#   Classes                 Upper class types that can equip the item. (Map default is 'All: true')
#   Gender                  Gender that can equip the item. (Default: Both)
#   Locations               Equipment's placement. (Default: None)
#   WeaponLevel             Weapon level. (Default: 1 for Weapons)
#   ArmorLevel              Armor level. (Default: 1 for Armors)
#   EquipLevelMin           Minimum required level to equip. (Default: 0)
#   EquipLevelMax           Maximum level that can equip. (Default: 0)
#   Refineable              If the item can be refined. (Default: false)
#   Gradable                If the item can be graded. (Default: false)
#   View                    View sprite of an item. (Default: 0)
#   AliasName               Another item's AegisName that will be sent to the client instead of this item's AegisName. (Default: null)
#   Flags:                  Item flags. (Default: null)
#     BuyingStore           If the item is available for Buyingstores. (Default: false)
#     DeadBranch            If the item is a Dead Branch. (Default: false)
#     Container             If the item is part of a container. (Default: false)
#     UniqueId              If the item is a unique stack. (Default: false)
#     BindOnEquip           If the item is bound to the character upon equipping. (Default: false)
#     DropAnnounce          If the item has a special announcement to self on drop. (Default: false)
#     NoConsume             If the item is consumed on use. (Default: false)
#     DropEffect            If the item has a special effect on the ground when dropped by a monster. (Default: None)
#   Delay:                  Item use delay. (Default: null)
#     Duration              Duration of delay in seconds.
#     Status                Status Change used to track delay. (Default: None)
#   Stack:                  Item stack amount. (Default: null)
#     Amount                Maximum amount that can be stacked.
#     Inventory             If the stack is applied to player's inventory. (Default: true)
#     Cart                  If the stack is applied to the player's cart. (Default: false)
#     Storage               If the stack is applied to the player's storage. (Default: false)
#     GuildStorage          If the stack is applied to the player's guild storage. (Default: false)
#   NoUse:                  Conditions when the item is unusable. (Default: null)
#     Override              Group level to override these conditions. (Default: 100)
#     Sitting               If the item can not be used while sitting. (Default: false)
#   Trade:                  Trade restrictions. (Default: null)
#     Override              Group level to override these conditions. (Default: 100)
#     NoDrop                If the item can not be dropped. (Default: false)
#     NoTrade               If the item can not be traded. (Default: false)
#     TradePartner          If the item can not be traded to the player's partner. (Default: false)
#     NoSell                If the item can not be sold. (Default: false)
#     NoCart                If the item can not be put in a cart. (Default: false)
#     NoStorage             If the item can not be put in a storage. (Default: false)
#     NoGuildStorage        If the item can not be put in a guild storage. (Default: false)
#     NoMail                If the item can not be put in a mail. (Default: false)
#     NoAuction             If the item can not be put in an auction. (Default: false)
#   Script                  Script to execute when the item is used/equipped. (Default: null)
#   EquipScript             Script to execute when the item is equipped. (Default: null)
#   UnEquipScript           Script to execute when the item is unequipped or when a rental item expires. (Default: null)
###########################################################################

Header:
  Type: ITEM_DB
  Version: 3

Body:
  # Expande permanentemente o Storage 2 da conta em 100 espacos.
  - Id: 9689
    AegisName: Storage_Expansion_Coupon
    Name: Cupom de Expansao do Armazem
    Type: Delayconsume
    Weight: 10
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoCart: true
      NoStorage: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
    Script: |
      mes "[Expansao do Armazem]";
      mes "Este cupom aumenta permanentemente o ^00CC00Storage 2^000000 da sua conta em ^00CC00100 espacos^000000.";
      mes "O Storage 2 e desbloqueado no primeiro uso e possui limite de ^FF0000300 espacos^000000.";
      mes "Use ^00CC00@storage2^000000 para abri-lo.";
      next;
      if (select("Confirmar expansao:Cancelar") == 2) {
        mes "A expansao foi cancelada. O cupom nao foi consumido.";
        close;
      }
      if (countitem(9689) < 1) {
        mes "O cupom nao foi encontrado no inventario.";
        close;
      }
      delitem 9689,1;
      if (expandstorage2(100)) {
        mes "Seu Storage 2 foi expandido permanentemente em ^00CC00100 espacos^000000.";
        mes "Use ^00CC00@storage2^000000 para acessa-lo.";
      } else {
        getitem 9689,1;
        mes "Nao foi possivel realizar a expansao.";
        mes "O Storage 2 desta conta ja atingiu 300 espacos.";
      }
      close;

  - Id: 810014
    AegisName: Precision_Rifle_Copy
    Name: Precision Piercer
    Type: Weapon
    SubType: Rifle
    Weight: 1800
    Attack: 250
    Range: 9
    Slots: 2
    Trade:
      NoDrop: true
      NoSell: true
    Jobs:
      Rebellion: true
    Locations:
      Both_Hand: true
    WeaponLevel: 5
    EquipLevelMin: 175
    Refineable: true
    Gradable: true
    Script: |
      .@r = getrefine();
      if (.@r>0) {
        bonus bLongAtkRate,10 * .@r;
        bonus bAtk,10 * .@r;
      }
      bonus bVariableCastrate,-25;
      bonus bDelayRate,-30;
      bonus bLongAtkRate,100;
      bonus bCritical,30;
      bonus bCritAtkRate,20;

      bonus bMaxHPRate,20;
      bonus bMaxSPRate,20;

      .@g = getenchantgrade();

      if (.@g >= ENCHANTGRADE_D) {
          bonus bLongAtkRate,25;
          bonus bAtk,25;
          if (.@g >= ENCHANTGRADE_C) {
              bonus bLongAtkRate,25;
              bonus bAtk,25;
              if (.@g >= ENCHANTGRADE_B) {
                  bonus bCastRate, -.@r;
                  bonus bLongAtkRate,25;
                  bonus bAtk,25;
                  if (.@g >= ENCHANTGRADE_A) {
                      bonus bDelayRate, -.@r;
                      bonus bLongAtkRate,25;
                      bonus bAtk,25;
                  }
              }
          }
      }
  - Id: 26141
    AegisName: WitchsBroomStick_
    Name: Witch's Broom
    Type: Weapon
    SubType: Staff
    Weight: 300
    Attack: 200
    MagicAttack: 200
    Range: 1
    Slots: 2
    Trade:
      NoDrop: true
      NoSell: true
    Jobs:
      Acolyte: true
      Priest: true
      Mage: true
      Wizard: true
      Sage: true
      Novice: true
      SuperNovice: true
      SoulLinker: true
    Locations:
      Right_Hand: true
    WeaponLevel: 5
    EquipLevelMin: 175
    Refineable: true
    Gradable: true
    Script: |
      .@r = getrefine();
      if (.@r>0) {
        bonus bMAtkRate,20 * .@r;
        bonus bMAtk,20 * .@r;
        bonus bHealPower,30 * .@r;
      }
      bonus bVariableCastrate,-30;
      bonus bDelayRate,-35;
      bonus bMAtkRate,150;
      bonus bHealPower,300;

      bonus bMaxHPRate,20;
      bonus bMaxSPRate,20;

      .@g = getenchantgrade();

      if (.@g >= ENCHANTGRADE_D) {
          bonus bMAtkRate,50;
          bonus bMAtk,50;
          bonus bHealPower,30;
          if (.@g >= ENCHANTGRADE_C) {
              bonus bMAtkRate,50;
              bonus bMAtk,50;
              bonus bHealPower,30;
              if (.@g >= ENCHANTGRADE_B) {
                  bonus bMAtkRate,50;
                  bonus bMAtk,50;
                  bonus bHealPower,30;
                  bonus bCastRate, -.@r;
                  if (.@g >= ENCHANTGRADE_A) {
                      bonus bMAtkRate,50;
                      bonus bMAtk,50;
                      bonus bHealPower,30;
                      bonus bDelayRate, -.@r;
                  }
              }
          }
      }
