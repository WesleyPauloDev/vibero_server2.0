  - Id: 9694
    AegisName: Mini_Refiner
    Name: Mini Refinadora
    Type: Usable
    Buy: 10
    Weight: 10
    Flags:
      NoConsume: true
    Script: |
      disable_items;
      .@ticket_id = 9694;
      setarray .@target_slots[0], EQI_HEAD_TOP, EQI_ARMOR, EQI_HAND_R, EQI_HAND_L, EQI_GARMENT, EQI_SHOES;
      setarray .@slot_name$[0], "Topo", "Armadura", "Arma", "Escudo", "Capa", "Botas";

      .@menu$ = "";
      .@count = 0;
      for (.@i = 0; .@i < getarraysize(.@target_slots); ++.@i) {
         .@slot = .@target_slots[.@i];
         if (!getequipisequiped(.@slot))
            continue;
         if (!getequipisenableref(.@slot))
            continue;
         .@refine = getequiprefinerycnt(.@slot);
         if (.@refine < 7 || .@refine > 11)
            continue;
         .@menu$ += .@slot_name$[.@i] + " - " + getequipname(.@slot) + " [+" + .@refine + " -> +" + (.@refine + 1) + "]:";
         .@slot_list[.@count] = .@slot;
         .@slot_label$[.@count] = .@slot_name$[.@i];
         ++.@count;
      }

      mes "[Mini Refinadora]";
      if (.@count == 0) {
         mes "Equipe um item elegivel entre ^0000FF+7 e +11^000000.";
         mes "Slots aceitos:";
         mes "Topo, armadura, arma, escudo, capa e botas.";
         close;
      }

      mes "Escolha o equipamento que deseja refinar.";
      next;
      .@pick = select(.@menu$ + "Cancelar") - 1;
      if (.@pick >= .@count)
         close;

      .@part = .@slot_list[.@pick];
      .@equip_id = getequipid(.@part);
      .@refine = getequiprefinerycnt(.@part);
      setarray .@card[0], getequipcardid(.@part,0), getequipcardid(.@part,1), getequipcardid(.@part,2), getequipcardid(.@part,3);

      mes "[Mini Refinadora]";
      if (!getequipisequiped(.@part) || .@equip_id <= 0) {
         mes "O equipamento selecionado nao esta mais equipado.";
         close;
      }
      if (!getequipisenableref(.@part)) {
         mes "Este equipamento nao pode ser refinado.";
         close;
      }
      if (.@refine < 7 || .@refine > 11) {
         mes "Este item precisa estar entre ^0000FF+7 e +11^000000.";
         close;
      }

      mes "Item: ^0055FF" + getitemname(.@equip_id) + "^000000";
      mes "Slot: ^0055FF" + .@slot_label$[.@pick] + "^000000";
      mes "Refino atual: ^0055FF+" + .@refine + "^000000";
      mes "Novo refino: ^0055FF+" + (.@refine + 1) + "^000000";
      mes "Deseja realmente refinar este item sem chance de falha?";
      next;
      if (select("Confirmar:Cancelar") == 2)
         close;

      if (countitem(.@ticket_id) < 1) {
         mes "[Mini Refinadora]";
         mes "Voce nao possui mais a Mini Refinadora.";
         close;
      }

      if (callfunc("F_IsEquipIDHack", .@part, .@equip_id) ||
          callfunc("F_IsEquipRefineHack", .@part, .@refine) ||
          callfunc("F_IsEquipCardHack", .@part, .@card[0], .@card[1], .@card[2], .@card[3])) {
         mes "[Mini Refinadora]";
         mes "O equipamento foi alterado durante o processo.";
         close;
      }

      delitem .@ticket_id,1;
      successrefitem .@part;
      specialeffect2 EF_REFINEOK;
      mes "[Mini Refinadora]";
      mes "Refino concluido com sucesso para ^0055FF+" + (.@refine + 1) + "^000000.";
      close;

