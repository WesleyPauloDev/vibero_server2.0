  - Id: 26243
    AegisName: Evolved_Fist
    Name: Evolved Knuckle
    Type: Weapon
    SubType: Knuckle
    Buy: 2000
    Weight: 1000
    Attack: 100
    Range: 1
    Slots: 1
    Jobs:
      Monk: true
      Priest: true
    Locations:
      Right_Hand: true
    WeaponLevel: 5
    EquipLevelMin: 30
    Refineable: true
    Gradable: true
    Script: |
      bonus bStr,2;
      bonus bDex,1;
      bonus2 bSkillCooldown,"SR_TIGERCANNON",-4000;
      bonus bVariableCastrate,-100;
      bonus bDelayRate,-100;

      .@g = getenchantgrade();

      if (.@g>=ENCHANTGRADE_D) {
         bonus bLongAtkRate,10;
         if (.@g>=ENCHANTGRADE_C) {
            bonus2 bAddSize,Size_All,10;
            if (.@g>=ENCHANTGRADE_B) {
               bonus2 bAddRace,RC_All,10;
               if (.@g>=ENCHANTGRADE_A) {
                  bonus2 bAddEle,Ele_All,10;
               }
            }
         }
      }

